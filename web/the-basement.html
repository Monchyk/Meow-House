<!DOCTYPE html>
<html lang="en">
<!--
    ── the basement ────────────────────────────────────────────────────
    Unlinked. No PIN. If you found this URL, you're the operator.
    You don't run the scene — you lean on the weather and let the house
    decide how it breaks. Every control is pressure, not a command.
    ────────────────────────────────────────────────────────────────────
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>—</title>
  <style>
    :root { --bg:#0a0b0e; --panel:#14161c; --line:#232733; --ink:#c9d1e0; --dim:#6b7488; --hot:#c96b5a; --ok:#5ac98a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; background:var(--bg); color:var(--ink);
      font: 15px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    body { padding: 14px 14px 40px; max-width: 640px; margin: 0 auto; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    header h1 { font-size:13px; letter-spacing:.32em; text-transform:uppercase;
      color:var(--dim); font-weight:600; margin:0; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--line); flex:0 0 auto; transition:background .2s; }
    .dot.ok { background:var(--ok); box-shadow:0 0 8px var(--ok); }
    .dot.bad { background:var(--hot); }
    #mirror { margin-left:auto; color:var(--dim); font-size:12px; }
    h2 { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);
      margin:22px 0 10px; font-weight:600; }
    /* sliders */
    .slider { background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:12px 14px 16px; margin-bottom:10px; }
    .lab { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
    .lab span { font-size:14px; }
    .lab em { font-style:normal; color:var(--dim); font-size:11px; }
    input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px;
      background:#2a3140; border-radius:3px; outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px;
      border-radius:50%; background:var(--ink); border:3px solid var(--bg); cursor:pointer; }
    input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:50%;
      background:var(--ink); border:3px solid var(--bg); cursor:pointer; }
    /* scene cards */
    #cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .card { text-align:left; background:var(--panel); border:1px solid var(--line);
      border-radius:10px; padding:12px; color:var(--ink); cursor:pointer; transition:background .12s, border-color .12s; }
    .card:active, .card.fired { background:#20242e; border-color:var(--hot); }
    .card strong { display:block; font-size:13px; font-weight:600; }
    .card span { display:block; color:var(--dim); font-size:11px; margin-top:3px; }
    /* log */
    #log { margin-top:20px; color:var(--dim); font-size:11px; min-height:1.4em; }
    #log div { padding:1px 0; }
    footer { margin-top:24px; color:#3b4252; font-size:10px; letter-spacing:.1em; }
  </style>
</head>
<body>
  <header>
    <span id="link-dot" class="dot"></span>
    <h1>the basement</h1>
    <span id="mirror">—</span>
  </header>

  <h2>Weather &nbsp;·&nbsp; drag to press, release to reset</h2>
  <div id="sliders"></div>

  <h2>The deck &nbsp;·&nbsp; one tap, then let it recover</h2>
  <div id="cards"></div>

  <div id="log"></div>
  <footer>pressure, not commands. the house decides how it breaks.</footer>

  <script src="operator.js"></script>
</body>
</html>
