<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep House — Attune</title>
<style>
  :root { color-scheme: dark; --bg:#04050a; --fg:#dce6fb; --dim:#7a8299; --gold:#f2c94c; --line:#1a2138; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 40px; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: #b8a9e0; margin: 0; font-weight: 600; }
  .dots { text-align: center; margin: 10px 0 16px; }
  .dots i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #232c47; margin: 0 3px; }
  .dots i.on { background: var(--gold); } .dots i.done { background: #6a5fb0; }
  .prompt { text-align: center; font-size: 24px; font-weight: 300; margin: 6px 0 4px; }
  .prompt b { color: var(--gold); font-weight: 500; }
  .sub { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 20px; min-height: 18px; }
  .choices { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); }
  .choices.words { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); max-width: 760px; margin: 0 auto; }
  .choices.schemes { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); max-width: 820px; margin: 0 auto; }
  .choices.grid48 { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); max-height: 74vh; overflow: auto; padding: 4px; }
  .choice { position: relative; background: #080b14; border: 1px solid var(--line); border-radius: 13px;
    padding: 8px; cursor: pointer; transition: border-color .15s, transform .1s, background .15s; text-align: center; }
  .choice:hover { border-color: #4a5a8c; transform: translateY(-2px); }
  .choice.sel { border-color: var(--gold); background: #12162a; }
  .choice canvas { display: block; width: 100%; height: 118px; border-radius: 7px; }
  .choice .lab { margin-top: 6px; font-size: 12.5px; }
  .choice .lab small { display: block; color: var(--dim); font-size: 10.5px; margin-top: 1px; }
  .choice.word { padding: 20px 14px; font-size: 19px; font-weight: 300; }
  .choice.word .sw { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 10px; box-shadow: 0 0 16px currentColor; }
  .choice.word small { display: block; color: var(--dim); font-size: 11px; margin-top: 6px; }
  .choice.scheme .band { height: 40px; border-radius: 8px; margin-bottom: 8px; }
  .choice.scheme .nm { font-size: 15px; } .choice.scheme small { display: block; color: var(--dim); font-size: 11px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  button { background: #10152a; color: var(--fg); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 16px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #4a5a8c; }
  button.ghost { background: transparent; color: var(--dim); border-color: transparent; }
  .result { text-align: center; }
  .result canvas { width: 100%; max-width: 620px; height: 60vh; max-height: 620px; border-radius: 16px;
    background: #04050a; border: 1px solid var(--line); display: block; margin: 0 auto; }
  .idline { font: 13px ui-monospace, monospace; color: var(--gold); letter-spacing: 0.14em; margin: 16px 0 4px; }
  .slug { font-size: 20px; font-weight: 300; } .slug b { color: #b8a9e0; }
  .recipe { color: var(--dim); font-size: 12.5px; margin: 10px auto 0; max-width: 560px; line-height: 1.7; }
  .count { color: var(--dim); font-size: 12px; margin-top: 14px; } .count b { color: var(--gold); }
  .resbtns { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .wait { text-align: center; color: var(--dim); padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Attune</h1></header>
  <div class="dots" id="dots"></div>
  <div id="stage"><p class="wait">loading the gallery…</p></div>
</div>

<script src="palettes.js"></script>
<script src="party.js"></script>
<script src="viz/symmetry.js"></script>
<script>
(function () {
  "use strict";
  var TAU = Math.PI * 2;
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }
  var SYM = window.SYM, PALETTES = window.PALETTES;
  if (!SYM || !PALETTES) { document.getElementById("stage").innerHTML = '<p class="wait">could not load the gallery (symmetry.js / palettes.js).</p>'; return; }
  var SCHEMES = PALETTES.all();                 // [{id, mood, colors:[bareHex×4]}]
  var EXH = SYM.EXHIBIT_TITLES;                  // all 66 real exhibit titles

  /* ── colour: use the real atlas via orderColor (the vivid path the gallery/lamps use) ── */
  function hexToRgb(h) { var n = parseInt(h, 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; }
  function ramp(cols) { return cols.map(hexToRgb); }
  function sampleRamp(rr, t) { t = ((t % 1) + 1) % 1; var s = t * rr.length, i = Math.floor(s) % rr.length, n = (i + 1) % rr.length;
    var f = s - Math.floor(s), sm = f * f * (3 - 2 * f);
    return { r: lerp(rr[i].r, rr[n].r, sm) | 0, g: lerp(rr[i].g, rr[n].g, sm) | 0, b: lerp(rr[i].b, rr[n].b, sm) | 0 }; }
  function rgba(c, a) { return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }
  function bandCss(cols) { return "linear-gradient(90deg," + cols.map(function (c) { return "#" + c; }).join(",") + ")"; }

  /* ── the blendable family: real exhibit titles whose math I can fuse (pt(u,σ)→[x,y]).
        Any pair of these can be nested / woven / pushed. Anything else can still be
        LAYERED (both real exhibits drawn in one frame) — so every pair does something,
        but the math-mash options only appear when both sides are blendable. ──────────── */
  var BLENDABLE = {
    "Rose curve": function (u, s) { var k = lerp(3.4, 5, s), t = u * TAU, r = Math.cos(k * t); return [r * Math.cos(t), r * Math.sin(t)]; },
    "Lissajous": function (u, s) { var b = lerp(2.55, 3, s), t = u * TAU; return [Math.sin(3 * t), Math.sin(b * t)]; },
    "Logarithmic spiral": function (u, s) { var turns = lerp(2, 4, s), t = u * TAU * turns, r = (Math.exp(1.6 * u) - 1) / (Math.exp(1.6) - 1); return [r * Math.cos(t), r * Math.sin(t)]; },
    "Fermat spiral": function (u, s) { var t = u * TAU * lerp(3, 5, s), r = Math.sqrt(u); return [r * Math.cos(t), r * Math.sin(t)]; },
    "Lemniscate": function (u, s) { var t = u * TAU, d = 1 + Math.sin(t) * Math.sin(t), w = lerp(0.6, 1, s); return [Math.cos(t) / d, w * Math.sin(t) * Math.cos(t) / d]; },
    "Hypocycloid": function (u, s) { var rr = lerp(0.28, 0.25, s), d = 0.75, t = u * TAU * 5, k = (1 - rr) / rr; return [0.5 * ((1 - rr) * Math.cos(t) + d * Math.cos(k * t)), 0.5 * ((1 - rr) * Math.sin(t) - d * Math.sin(k * t))]; },
    "Superformula": function (u, s) { var m = Math.round(lerp(5, 6, s)), t = u * TAU; var r = Math.pow(Math.pow(Math.abs(Math.cos(m * t / 4)), 7) + Math.pow(Math.abs(Math.sin(m * t / 4)), 7), -1 / 6); r = clamp(r, 0, 1.4); return [r * Math.cos(t) * 0.72, r * Math.sin(t) * 0.72]; },
  };
  function bothBlend(g) { return g.second && BLENDABLE[g.core] && BLENDABLE[g.second]; }

  /* ── σ / motion from the accumulated PAD ──────────────────────────────────── */
  function sigmaAt(pad, now) { var ar = (pad.a + 1) / 2, home = clamp(0.5 + pad.d * 0.5, 0.08, 0.94);
    return clamp(home + (0.16 + ar * 0.3) * (0.5 - 0.5 * Math.cos(now / 1000 * (0.1 + ar * 0.5))), 0, 1); }

  /* ── mash drawing (only for blendable pairs) ──────────────────────────────── */
  function frame(ctx, w, h) { ctx.fillStyle = "rgba(4,5,10,0.22)"; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = "lighter"; }
  function endFrame(ctx) { ctx.globalCompositeOperation = "source-over"; }
  function strokePts(ctx, pts, rr, alpha, phase, lw) { var N = pts.length - 1, B = Math.min(56, N), per = Math.ceil(N / B);
    ctx.lineWidth = lw || 1.6; ctx.lineCap = "round";
    for (var b = 0; b * per < N; b++) { var from = b * per, to = Math.min(N, from + per);
      ctx.strokeStyle = rgba(sampleRamp(rr, from / N + phase), alpha); ctx.beginPath(); ctx.moveTo(pts[from][0], pts[from][1]);
      for (var j = from + 1; j <= to; j++) ctx.lineTo(pts[j][0], pts[j][1]); ctx.stroke(); } }
  function buildPath(pt, N, R, cx, cy) { var a = []; for (var i = 0; i <= N; i++) { var p = pt(i / N); a.push([cx + p[0] * R, cy + p[1] * R]); } return a; }

  /* ── a renderer owns its own exhibit instances so it can animate across frames ── */
  function makeRenderer(spec) {
    // spec: { kind:'exhibit'|'layer'|'mash', titles:[...], meet, scheme, pad, paceMul, strength }
    var insts = null, rr = ramp(SCHEMES[spec.scheme].colors);
    if (spec.kind === "exhibit") insts = [SYM.makeExhibit(spec.titles[0])];
    else if (spec.kind === "layer") insts = [SYM.makeExhibit(spec.titles[0]), SYM.makeExhibit(spec.titles[1])];
    return function draw(ctx, w, h, dt, now) {
      var sig = sigmaAt(spec.pad, now), palHex = SCHEMES[spec.scheme].colors, color = SYM.orderColor(sig, palHex);
      if (spec.kind === "exhibit") { var e = insts[0]; e.update(dt, sig * 2 - 1); e.q = sig; e.draw(ctx, w, h, dt, { alpha: 0.95, fade: 0.2, color: color, tint: null }); return; }
      if (spec.kind === "layer") {
        var a = insts[0], b = insts[1];
        a.update(dt, sig * 2 - 1); a.q = sig; a.draw(ctx, w, h, dt, { alpha: 0.88, fade: 0.2, color: color, tint: null });
        b.update(dt, sig * 2 - 1); b.q = sig; b.draw(ctx, w, h, dt, { alpha: 0.88, fade: 0, color: SYM.orderColor(sig, palHex), tint: null });
        return;
      }
      // mash (both blendable)
      var A = BLENDABLE[spec.titles[0]], B = BLENDABLE[spec.titles[1]], cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.4;
      var ar = (spec.pad.a + 1) / 2, str = spec.strength != null ? spec.strength : 0.35 + ar * 0.45;
      var stir = now / 1000 * (0.15 + ar * 0.8) * (spec.paceMul || 1), ph = now / 1000 * 0.03;
      frame(ctx, w, h);
      if (spec.meet === "woven") {
        strokePts(ctx, buildPath(function (u) { var a = A(u, sig), b = B(u, sig); return [lerp(a[0], b[0], str), lerp(a[1], b[1], str)]; }, 320, R, cx, cy), rr, 0.6, ph);
      } else if (spec.meet === "pushing") {
        var ca = Math.cos(stir), sa = Math.sin(stir), k = 1 / (1 + str * 0.9);
        strokePts(ctx, buildPath(function (u) { var a = A(u, sig), b = B(u, sig), bx = b[0] * ca - b[1] * sa, by = b[0] * sa + b[1] * ca; return [(a[0] + str * bx) * k, (a[1] + str * by) * k]; }, 320, R, cx, cy), rr, 0.58, ph);
      } else { // nested
        strokePts(ctx, buildPath(function (u) { return B(u, sig); }, 240, R, cx, cy), rr, 0.24, ph, 1.3);
        var M = 30, sc = (0.1 + str * 0.3) * R, du = 0.004;
        for (var jj = 0; jj < M; jj++) { var u0 = jj / M + stir * 0.02, ho = B(u0, sig), h2 = B(u0 + du, sig);
          var ang = Math.atan2(h2[1] - ho[1], h2[0] - ho[0]), c2 = Math.cos(ang), s2 = Math.sin(ang), ox = cx + ho[0] * R, oy = cy + ho[1] * R, pts = [];
          for (var i = 0; i <= 70; i++) { var a2 = A(i / 70, sig); pts.push([ox + (a2[0] * sc * c2 - a2[1] * sc * s2), oy + (a2[0] * sc * s2 + a2[1] * sc * c2)]); }
          strokePts(ctx, pts, rr, 0.5, jj / M + ph, 1.2); }
      }
      endFrame(ctx);
    };
  }

  /* ── the quiz ─────────────────────────────────────────────────────────────── */
  var G;
  function reset() { G = { need: null, scheme: 1, core: EXH[0], second: null, meet: "singular", pad: { v: 0.2, a: 0.1, d: 0.1 }, padN: 0, paceMul: 1, paceWord: "breathing" }; }
  function addPad(p, wt) { wt = wt || 1; G.pad.v = (G.pad.v * G.padN + p.v * wt) / (G.padN + wt); G.pad.a = (G.pad.a * G.padN + p.a * wt) / (G.padN + wt); G.pad.d = (G.pad.d * G.padN + p.d * wt) / (G.padN + wt); G.padN += wt; }

  var NEEDS = [
    { lab: "to settle", small: "quiet, held", hex: "#4A8B8C", pad: { v: 0.4, a: -0.5, d: 0.4 }, word: "settled" },
    { lab: "to rise", small: "lift, charge", hex: "#F2C94C", pad: { v: 0.5, a: 0.7, d: 0.2 }, word: "rising" },
    { lab: "to wander", small: "drift, open", hex: "#8E7CC3", pad: { v: 0.2, a: 0.1, d: -0.3 }, word: "wandering" },
    { lab: "to connect", small: "meet, weave", hex: "#E0956B", pad: { v: 0.6, a: 0.0, d: 0.1 }, word: "connected" },
  ];
  var PACES = [
    { lab: "still", small: "barely moving", hex: "#4A5A66", mul: 0.25, pad: { v: 0, a: -0.6, d: 0.2 } },
    { lab: "breathing", small: "slow swell", hex: "#4A8B8C", mul: 0.6, pad: { v: 0, a: -0.1, d: 0 } },
    { lab: "stirring", small: "alive, turning", hex: "#D4A055", mul: 1.2, pad: { v: 0, a: 0.4, d: 0 } },
    { lab: "racing", small: "electric", hex: "#F2C94C", mul: 2.2, pad: { v: 0, a: 0.8, d: -0.1 } },
  ];

  var QUESTIONS = [
    { id: "need", prompt: "What do you <b>need</b> tonight?", sub: "the room leans this way", kind: "need" },
    { id: "colour", prompt: "Which <b>world</b>?", sub: "the palette it lives in", kind: "scheme" },
    { id: "core", prompt: "Which shape <b>calls</b> you?", sub: "your core — all 48, pick one", kind: "core" },
    { id: "beneath", prompt: "And <b>beneath</b> it?", sub: "a second shape, or just the one", kind: "beneath" },
    { id: "meet", prompt: "How do they <b>meet</b>?", sub: "these two can fuse", kind: "meet",
      skipIf: function () { return !bothBlend(G); } },
    { id: "pace", prompt: "At what <b>pace</b>?", sub: "", kind: "pace" },
  ];

  var step = 0, live = [], last = performance.now();
  var stage = document.getElementById("stage"), dotsEl = document.getElementById("dots");
  function order() { return QUESTIONS.filter(function (q) { return !(q.skipIf && q.skipIf()); }); }
  function drawDots() { var seq = order(), h = ""; for (var i = 0; i <= seq.length; i++) h += '<i class="' + (i < step ? "done" : i === step ? "on" : "") + '"></i>'; dotsEl.innerHTML = h; }

  function tile(spec, label, small, onClick) {
    var d = document.createElement("div"); d.className = "choice";
    var cv = document.createElement("canvas"); d.appendChild(cv);
    var lab = document.createElement("div"); lab.className = "lab"; lab.innerHTML = label + (small ? "<small>" + small + "</small>" : ""); d.appendChild(lab);
    d.addEventListener("click", onClick); live.push({ cv: cv, draw: makeRenderer(spec) }); return d;
  }
  function word(c, onClick) { var d = document.createElement("div"); d.className = "choice word";
    d.innerHTML = '<div class="sw" style="background:' + c.hex + ';color:' + c.hex + '"></div>' + c.lab + (c.small ? "<small>" + c.small + "</small>" : "");
    d.addEventListener("click", onClick); return d; }

  function render() {
    var seq = order(); if (step >= seq.length) return renderResult();
    var q = seq[step]; live = []; drawDots();
    stage.innerHTML = '<div class="prompt">' + q.prompt + '</div><div class="sub">' + (q.sub || "") + '</div>';
    var box = document.createElement("div"); box.className = "choices";

    if (q.kind === "need") { box.className = "choices words";
      NEEDS.forEach(function (c) { box.appendChild(word(c, function () { addPad(c.pad, 2); G.need = c.word; step++; render(); })); });
    } else if (q.kind === "pace") { box.className = "choices words";
      PACES.forEach(function (c) { box.appendChild(word(c, function () { G.paceMul = c.mul; G.paceWord = c.lab; addPad(c.pad, 1); step++; render(); })); });
    } else if (q.kind === "scheme") { box.className = "choices schemes";
      SCHEMES.forEach(function (s, i) { var d = document.createElement("div"); d.className = "choice scheme";
        d.innerHTML = '<div class="band" style="background:' + bandCss(s.colors) + '"></div><div class="nm">' + s.id + '</div><small>' + (s.mood || "") + '</small>';
        d.addEventListener("click", function () { G.scheme = i; step++; render(); }); box.appendChild(d); });
    } else if (q.kind === "core") { box.className = "choices grid48";
      EXH.forEach(function (title) { box.appendChild(tile({ kind: "exhibit", titles: [title], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul }, title, "", function () { G.core = title; step++; render(); })); });
    } else if (q.kind === "beneath") { box.className = "choices grid48";
      box.appendChild(tile({ kind: "exhibit", titles: [G.core], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul }, "just this one", "singular", function () { G.second = null; G.meet = "singular"; step++; render(); }));
      EXH.forEach(function (title) { if (title === G.core) return;
        box.appendChild(tile({ kind: "exhibit", titles: [title], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul }, title, "beneath", function () {
          G.second = title; G.meet = bothBlend(G) ? "woven" : "layered"; step++; render();
        })); });
    } else if (q.kind === "meet") {
      var modes = [{ m: "layered", lab: "layered", s: "both, overlaid" }, { m: "nested", lab: "nested", s: "inside" }, { m: "woven", lab: "woven", s: "blended" }, { m: "pushing", lab: "pushing", s: "tugging" }];
      modes.forEach(function (o) {
        var spec = o.m === "layered" ? { kind: "layer", titles: [G.core, G.second], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul }
                                     : { kind: "mash", titles: [G.core, G.second], meet: o.m, scheme: G.scheme, pad: G.pad, paceMul: G.paceMul };
        box.appendChild(tile(spec, o.lab, o.s, function () { G.meet = o.m; step++; render(); }));
      });
    }
    stage.appendChild(box);
    var nav = document.createElement("div"); nav.className = "nav";
    var back = document.createElement("button"); back.className = "ghost"; back.textContent = step === 0 ? "" : "← back";
    if (step > 0) back.addEventListener("click", function () { step--; render(); });
    nav.appendChild(back); nav.appendChild(document.createElement("span")); stage.appendChild(nav);
  }

  function possibilities() { var e = EXH.length, sc = SCHEMES.length, needs = 4, pace = 4;
    var singular = needs * e * 1 * sc * pace;               // core only
    var layered = needs * e * (e - 1) * 1 * sc * pace;      // any second, overlaid
    var blend = needs * 7 * 6 * 3 * sc * pace;              // both blendable × 3 fuse modes
    return singular + layered + blend; }
  function seedFor(g) { var key = [g.core, g.second, g.meet, g.need, g.scheme, g.paceWord, Math.round(g.pad.v * 9), Math.round(g.pad.a * 9), Math.round(g.pad.d * 9)].join("|");
    var h = 2166136261; for (var i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = (h * 16777619) >>> 0; } return "DH-" + h.toString(36).toUpperCase().slice(0, 6); }

  function finalSpec() {
    if (!G.second) return { kind: "exhibit", titles: [G.core], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul };
    if (G.meet === "layered") return { kind: "layer", titles: [G.core, G.second], scheme: G.scheme, pad: G.pad, paceMul: G.paceMul };
    return { kind: "mash", titles: [G.core, G.second], meet: G.meet, scheme: G.scheme, pad: G.pad, paceMul: G.paceMul };
  }
  function renderResult() {
    drawDots(); live = [];
    var slug = G.core + (G.second ? " × " + G.second : ""), seed = seedFor(G);
    stage.innerHTML = '<div class="result"><canvas id="final"></canvas>' +
      '<div class="idline">seed ' + seed + '</div>' +
      '<div class="slug"><b>' + (G.need || "") + '</b> · ' + slug + '</div>' +
      '<div class="recipe">' + G.meet + ' · ' + SCHEMES[G.scheme].id + ' · ' + G.paceWord + '</div>' +
      '<div class="count">one of <b>' + possibilities().toLocaleString() + '</b> · this one is yours</div>' +
      '<div class="resbtns"><button id="again">make another</button>' +
      '<button id="tweak" class="ghost">← change the last answer</button></div></div>';
    live.push({ cv: document.getElementById("final"), draw: makeRenderer(finalSpec()) });
    document.getElementById("again").addEventListener("click", function () { reset(); step = 0; render(); });
    document.getElementById("tweak").addEventListener("click", function () { step = order().length - 1; render(); });
  }

  function fit(cv) { var w = cv.clientWidth, h = cv.clientHeight; if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } }
  function loop(now) { var dt = Math.min(0.05, (now - last) / 1000); last = now;
    live.forEach(function (o) { fit(o.cv); o.draw(o.cv.getContext("2d"), o.cv.width, o.cv.height, dt, now); });
    requestAnimationFrame(loop); }
  reset(); render(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
