<!DOCTYPE html>
<!-- ROLE: SANDBOX. Raw MeowParty scene, tune live. Same engine/lamps/scene as
     player.html (party.js, party-main.js, hue.js, meowparty-scene.js, mic-sync.js);
     this page just omits the scene-swap host + sequencing so you can tweak freely.
     Bake tuned values into player.html's shell, not here. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEP HOUSE — MeowParty</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04050a; overflow: hidden; }
    #stage { display: block; width: 100vw; height: 100vh; }

    /* Party's display firewall: momentary mode cues only, never dashboard prose. */
    #toasts {
      position: fixed; left: 0; right: 0; bottom: 8vh;
      display: flex; flex-direction: column-reverse; align-items: center; gap: 8px;
      pointer-events: none; z-index: 10;
    }
    .toast {
      font: 500 clamp(14px, 2.2vh, 20px) "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.06em; color: #dfe6f5;
      background: rgba(10, 14, 26, 0.55); border: 1px solid rgba(150, 160, 200, 0.25);
      padding: 6px 16px; border-radius: 999px;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .toast.show { opacity: 0.92; transform: translateY(0); }
    #meow-drawer-toggle { position: fixed; top: 18px; right: 18px; z-index: 30; width: 42px; height: 42px;
      border: 1px solid rgba(190,170,255,.28); border-radius: 10px; background: rgba(8,10,20,.52);
      color: #dfe6f5; font-size: 21px; cursor: pointer; backdrop-filter: blur(8px); }
    #meow-drawer { position: fixed; top: 18px; right: 18px; z-index: 29; width: min(270px, calc(100vw - 36px));
      padding: 58px 16px 16px; border: 1px solid rgba(190,170,255,.22); border-radius: 14px;
      background: rgba(8,10,20,.82); color: #dfe6f5; font: 13px/1.35 ui-monospace, Consolas, monospace;
      transform: translateY(-12px) scale(.98); opacity: 0; pointer-events: none; transition: .22s ease;
      backdrop-filter: blur(14px); }
    #meow-drawer.open { transform: none; opacity: 1; pointer-events: auto; }
    #meow-drawer h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #f2c94c; }
    #meow-drawer label { display: grid; grid-template-columns: 1fr 76px; gap: 7px; align-items: center; margin: 10px 0; }
    #meow-drawer input { width: 100%; accent-color: #bda7ff; }
    #meow-drawer output { color: #fff; text-align: right; }
    #meow-drawer .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 12px; }
    #meow-drawer button[data-phase] { padding: 7px 3px; border: 1px solid rgba(190,170,255,.22); border-radius: 7px; background: rgba(40,34,70,.7); color: #dfe6f5; cursor: pointer; }
    #meow-drawer button[data-phase].active { border-color: #f2c94c; color: #fff5b8; }
    #meow-drawer .hint { margin: 12px 0 0; color: #a9b0c8; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="toasts"></div>
  <button id="meow-drawer-toggle" aria-label="Open colour envelope controls" aria-expanded="false">☰</button>
  <aside id="meow-drawer" aria-label="MeowParty colour envelope controls">
    <h2>colour envelope</h2>
    <label><span>attack</span><output data-out="colorAttack">0.70</output><input type="range" data-meow="colorAttack" min="0.1" max="8" step="0.1" value="0.7"></label>
    <label><span>decay</span><output data-out="colorDecay">1.40</output><input type="range" data-meow="colorDecay" min="0.1" max="12" step="0.1" value="1.4"></label>
    <label><span>sustain</span><output data-out="colorSustain">0.52</output><input type="range" data-meow="colorSustain" min="0" max="1" step="0.05" value="0.52"></label>
    <label><span>release</span><output data-out="colorRelease">2.20</output><input type="range" data-meow="colorRelease" min="0.1" max="16" step="0.1" value="2.2"></label>
    <label><span>bleed clear</span><output data-out="colorBleed">0.10</output><input type="range" data-meow="colorBleed" min="0" max="0.3" step="0.01" value="0.1"></label>
    <div class="phases"><button data-phase="0">A</button><button data-phase="1">D</button><button data-phase="2" class="active">S</button><button data-phase="3">R</button></div>
    <p class="hint">brightness + colour bleed · mirrored in the dashboard</p>
  </aside>

  <!-- The Party stack stays intact. Scene 01 only swaps its visual director. -->
  <script src="hue.js"></script>
  <script src="palettes.js"></script>
  <script src="party.js"></script>
  <script src="viz/symmetry.js"></script>
  <script src="viz/cell-motion.js"></script>
  <script src="viz/wiring.js"></script>
  <script src="viz/organisms.js"></script>
  <script src="meowparty-scene.js"></script>
  <script src="party-main.js"></script>
  <script src="mic-sync.js"></script>
</body>
</html>
