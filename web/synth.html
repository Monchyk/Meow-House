<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEP HOUSE — the synth</title>
  <style>
    :root { --bg:#0a0d16; --panel:#121826; --line:rgba(150,170,220,0.16); --fg:#dce6fb;
            --dim:#8b9ac0; --accent:#5ad; --clock:#7fb0ff; --env:#7fe0a0; --out:#ffd890;
            --patch:#d98cff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 14px 26px;
      max-width: 1680px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    h1 { font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
    a.alt { font: 12px ui-monospace, monospace; color: var(--dim); }
    #conn { font: 12px ui-monospace, monospace; }
    #conn.on { color: #7fe0a0; } #conn.off { color: #e08a8a; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
    .wait { color: var(--dim); text-align: center; padding: 30px 0; }
    /* ── the map ── */
    /* the map is a diagram, not a hero image — cap its size so it doesn't balloon to
       fill a wide column, and centre it. aspect-ratio matches the viewBox. */
    .map { width: 100%; max-width: 780px; aspect-ratio: 100 / 54; height: auto; display: block;
           margin: 2px auto 0; background: #070a12; border-radius: 10px; touch-action: manipulation; }
    .node rect { fill: #131c30; stroke: var(--line); stroke-width: 0.4; cursor: pointer; transition: fill .12s; }
    .node.clock rect { stroke: var(--clock); } .node.env rect { stroke: var(--env); }
    .node.out rect { stroke: var(--out); } .node.panel rect { stroke: var(--dim); stroke-dasharray: 1.5 1; }
    .node:hover rect { fill: #1b2740; }
    .node text { fill: var(--fg); font: 2.5px ui-sans-serif, sans-serif; text-anchor: middle; pointer-events: none; }
    .node .val { fill: var(--accent); font: 1.9px ui-monospace, monospace; }
    .node .glow { fill: none; stroke: var(--accent); stroke-width: 0; opacity: 0.9; pointer-events: none; }
    .cord { stroke: var(--accent); fill: none; cursor: pointer; stroke-linecap: round; }
    .cord.patch { stroke: var(--patch); stroke-dasharray: 2 1.4; }
    .cord.auto { stroke: var(--dim); stroke-dasharray: 2 1.4; }
    .cord.latent { stroke: var(--patch); opacity: 0.45; stroke-dasharray: 1 1.5; }
    .collabel { fill: var(--dim); font: 2.7px ui-sans-serif, sans-serif; text-anchor: middle;
                letter-spacing: 0.3px; opacity: 0.55; pointer-events: none; }
    .cordhit { stroke: transparent; stroke-width: 4; fill: none; cursor: pointer; }
    .cordlabel { fill: var(--dim); font: 2.1px ui-sans-serif, sans-serif; text-anchor: middle; pointer-events: none; opacity: 0.75; }
    /* ── card panel ── */
    .card { position: sticky; top: 8px; }
    .card .empty { color: var(--dim); }
    .card .lvl { margin: 8px 0; }
    .card .eli5 { font-size: 14.5px; line-height: 1.5; }
    .card .math { font: 13px ui-monospace, monospace; color: var(--accent); background: #0c1120;
                  padding: 6px 8px; border-radius: 6px; overflow-x: auto; }
    .card .code { font: 12px ui-monospace, monospace; color: var(--dim); }
    .card .tag { display: inline-block; font: 11px ui-monospace, monospace; padding: 1px 7px; border-radius: 999px;
                 background: #1c2740; color: var(--dim); margin-bottom: 6px; }
    .card h2 { font-size: 16px; margin: 2px 0 4px; }
    .card .close { float: right; }
    /* ── knobs ── */
    .knob { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 9px 0; }
    .knob .nm { flex: 0 0 130px; font-size: 13px; cursor: pointer; }
    .knob .nm:hover { color: var(--accent); text-decoration: underline dotted; }
    .knob input[type=range] { flex: 1; min-width: 110px; accent-color: var(--accent); height: 30px; }
    .knob .v { flex: 0 0 54px; text-align: right; font: 12px ui-monospace, monospace; }
    .knob.modded .nm { color: var(--patch); }
    .knob .patchtag { flex: 1 0 100%; font-size: 11px; color: var(--patch); }
    .kgroup { margin: 4px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
              border-top: 1px solid #1b2338; padding-top: 8px; }
    .kgroup:first-child { border-top: 0; padding-top: 0; }
    /* the patterns: a scannable index (left) + a roomy reader (right) — not chips-in-a-box */
    .playout { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
    @media (max-width: 760px) { .playout { grid-template-columns: 1fr; } }
    .plist { display: flex; flex-direction: column; gap: 3px; max-height: 580px; overflow: auto; padding-right: 4px; }
    .ptag-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim);
              margin: 12px 0 3px; opacity: 0.8; }
    .ptag-h:first-child { margin-top: 0; }
    .ptile { text-align: left; background: #0e1424; color: var(--fg); border: 1px solid var(--line);
             border-radius: 8px; padding: 8px 11px; font-size: 13px; cursor: pointer; }
    .ptile:hover { border-color: var(--accent); }
    .ptile.sel { border-color: var(--accent); background: #16243c; color: #cfe6ff; }
    .preader { background: #0c1120; border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; min-height: 340px; }
    .preader .measure { max-width: 720px; }
    .preader .prompt { color: var(--dim); font-size: 14px; padding: 24px 0; }
    .preader h2 { font-size: 21px; margin: 4px 0 6px; }
    .preader .tag { display: inline-block; font: 11px ui-monospace, monospace; padding: 1px 8px; border-radius: 999px;
                    background: #1c2740; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .preader .lvl { margin: 14px 0; }
    .preader .eli5 { font-size: 16px; line-height: 1.6; }
    .preader .more { font-size: 14.5px; line-height: 1.62; opacity: 0.92; }
    .preader .more b, .preader .mathplain b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--dim); font-weight: 600; }
    .preader .math { font: 15px ui-monospace, monospace; color: var(--accent); background: #070a12;
                     padding: 10px 12px; border-radius: 7px; overflow-x: auto; }
    .preader .mathplain { font-size: 14px; line-height: 1.58; color: var(--dim); }
    .preader .code { font: 12.5px ui-monospace, monospace; color: var(--dim); }
    button { background: #1c2740; color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 34px; }
    button:hover { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: minmax(0, 860px) minmax(300px, 1fr); gap: 12px; align-items: start; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    /* the knobs fill the page width instead of stacking in one thin column; each group
       header spans a full row so the sections stay legible */
    .knobgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
                gap: 2px 32px; align-items: start; }
    .knobgrid .kgroup { grid-column: 1 / -1; }
    /* ── the patch bay (interactive routing) ── */
    .patchbay .hint { font-size: 12.5px; color: var(--dim); margin: 0 0 10px; max-width: 760px; }
    .patchbay .none { color: var(--dim); font-size: 13px; font-style: italic; margin: 6px 0 10px; }
    .patchbay .prow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 8px 0;
      padding: 8px 10px; background: #0e1424; border: 1px solid var(--line); border-radius: 10px; }
    .patchbay .prow.add { background: #0b1020; border-style: dashed; margin-top: 12px; }
    .patchbay select { background: #131c30; color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 9px; font-size: 13px; min-height: 36px; max-width: 220px; cursor: pointer; }
    .patchbay .psrc { border-color: var(--clock); }
    .patchbay .pdst { border-color: var(--patch); }
    .patchbay .arrow { color: var(--patch); font-size: 17px; line-height: 1; }
    .patchbay .pdepth { flex: 1; min-width: 130px; accent-color: var(--patch); height: 30px; }
    .patchbay .pdv { flex: 0 0 54px; text-align: right; font: 12px ui-monospace, monospace; color: var(--patch); }
    .patchbay #addpatch { border-color: var(--patch); color: var(--patch); }
    .patchbay .jacks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 2px 0 12px; }
    .patchbay .jlbl { font-size: 12px; color: var(--dim); margin-right: 4px; }
    .patchbay .jack { cursor: grab; user-select: none; background: #132038; color: var(--clock);
      border: 1px solid var(--clock); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
    .patchbay .jack:active { cursor: grabbing; }
    .patchbay .jack.dragging { opacity: 0.5; }
    /* a knob lit up as a live drop target while you drag a clock over it */
    .knob.dropok { outline: 2px dashed var(--patch); outline-offset: 3px; border-radius: 8px; background: #161f38; }
    .knob.dropok::after { content: "drop to drive this"; color: var(--patch); font-size: 11px; margin-left: 4px; }
    /* ── the info bulletin (pop-up you get when you click a slider title) ── */
    .popwrap { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
               background: rgba(4,6,12,0.62); padding: 20px; }
    .popwrap.on { display: flex; }
    .pop { position: relative; background: var(--panel); border: 1px solid var(--patch); border-radius: 14px;
           padding: 22px 24px; max-width: 460px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
    .pop .tag { display: inline-block; font: 11px ui-monospace, monospace; padding: 1px 8px; border-radius: 999px;
                background: #1c2740; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .pop h2 { font-size: 20px; margin: 8px 0 10px; }
    .pop .eli5 { font-size: 16px; line-height: 1.6; }
    .pop .math { font: 13px ui-monospace, monospace; color: var(--accent); background: #0c1120;
                 padding: 8px 10px; border-radius: 7px; margin-top: 12px; overflow-x: auto; }
    .pop .code { font: 12px ui-monospace, monospace; color: var(--dim); margin-top: 8px; }
    .pop .close { position: absolute; top: 10px; right: 12px; padding: 4px 9px; }
    .legend { font-size: 11px; color: var(--dim); margin-top: 6px; }
    .legend b.clock { color: var(--clock); } .legend b.env { color: var(--env); }
    .legend b.out { color: var(--out); } .legend b.patch { color: var(--patch); }
  </style>
</head>
<body>
  <header>
    <h1>Deep House — the synth</h1>
    <span><a class="alt" href="/dashboard.html">just the sliders →</a> &nbsp; <span id="conn" class="off">○ connecting…</span></span>
  </header>
  <div id="app"><p class="wait">connecting… is /party.html open?</p></div>
  <script src="tune-meta.js"></script>
  <script src="synth-cards.js"></script>
  <script src="synth.js"></script>
</body>
</html>
