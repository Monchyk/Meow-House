<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEP HOUSE — party dashboard</title>
  <style>
    :root { --bg:#0a0d16; --panel:#121826; --line:rgba(150,170,220,0.16); --fg:#dce6fb; --dim:#8b9ac0; --accent:#5ad; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 12px; max-width: 720px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    h1 { font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
    #conn { font: 12px ui-monospace, monospace; }
    #conn.on { color: #7fe0a0; } #conn.off { color: #e08a8a; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
    h3 em { color: var(--fg); font-style: normal; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
    .row.biz input, .row.zoom input { flex: 1; }   /* the two live faders stretch */
    b { font-weight: 600; color: var(--dim); font-size: 13px; }
    .small { font-size: 12px; color: var(--dim); }
    .wait { color: var(--dim); text-align: center; padding: 30px 0; }
    button { background: #1c2740; color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 40px; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.3; cursor: default; }
    input[type="range"] { accent-color: var(--accent); height: 32px; }
    .pill { padding: 2px 10px; border-radius: 999px; font: 600 12px ui-monospace, monospace; text-transform: uppercase; }
    .pill.spiral { background: rgba(90,170,220,0.22); color: #a8d8ff; }
    .pill.light { background: rgba(220,180,90,0.22); color: #ffd890; }
    .meter { height: 8px; background: #0c1120; border-radius: 6px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: linear-gradient(90deg, #3a6, #6cf); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .cols { grid-template-columns: 1fr; } }
    .col h3 { margin-bottom: 6px; }
    .item, .cat { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; margin: 4px 0; background: #0e1424; }
    .item.cur { outline: 1px solid var(--accent); }
    .cat.active { outline: 1px solid #ffd890; }
    .nm { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item button, .cat button { padding: 4px 8px; min-height: 32px; font-size: 12px; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); flex: none; }
    .lock { opacity: 0.7; }
    /* vetoed = switched off by the curator. Still listed and still re-enableable —
       a vanished entry reads as a bug — but visibly out of the rotation. */
    .cat.vetoed { opacity: 0.4; }
    .cat.vetoed .nm { text-decoration: line-through; }
    /* wrap, so the help line drops underneath its slider instead of squeezing it */
    .tune { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0; }
    .tune span { flex: 0 0 130px; font-size: 13px; color: var(--fg); }
    .tune input { flex: 1; min-width: 120px; }
    .tune em { flex: 0 0 60px; text-align: right; font: 12px ui-monospace, monospace; color: var(--fg); }
    /* The whole point of the rework: what this knob does to the ROOM, in plain words,
       readable in a dark room by someone who did not write the engine. */
    .tune .help { flex: 1 0 100%; margin: -2px 0 0; font-size: 11.5px; font-style: normal;
                  line-height: 1.35; color: var(--dim); opacity: 0.85; }
    /* a patched slider is being driven by a clock — its value moves on its own */
    .tune.modded span { color: var(--accent); }
    .tune .depth { flex: 0 1 120px; }
    /* A preset is a name and a sentence — the sentence is the interface, so it gets
       the same weight as the button rather than being a footnote. */
    .preset { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .preset > button:first-child { flex: 0 0 120px; min-height: 40px; text-align: left; }
    .preset .help { flex: 1; font-size: 11.5px; font-style: normal; line-height: 1.35;
                    color: var(--dim); opacity: 0.9; }
    .preset.mine > button:first-child { border-color: var(--accent); }
    .presets h4 { margin: 16px 0 2px; font-size: 13px; color: var(--fg); }
    .presets h4:first-of-type { margin-top: 8px; }
    /* Both heading buttons in one right-floated group — two separate floats stack in
       reverse and read as if the labels had been swapped. */
    .tuning h3 { display: flex; align-items: center; gap: 6px; }
    .tuning h3 .grpreset:first-of-type { margin-left: auto; }
    .grpreset { padding: 2px 8px; min-height: 26px; font-size: 11px; opacity: 0.75; font-weight: 400; }
    .small.stale { color: #f2b8a0; opacity: 1; line-height: 1.4; }
    .tuning h3 { margin: 18px 0 2px; padding-top: 10px; border-top: 1px solid #1b2338; }
    .tuning h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Party Dashboard</h1>
    <span id="conn" class="off">○ connecting…</span>
  </header>
  <div id="app"><p class="wait">connecting…</p></div>
  <script src="tune-meta.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
